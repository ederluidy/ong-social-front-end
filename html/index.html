<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONG Social</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <!-- Permite que usuários de teclado pulem diretamente para o conteúdo -->
    <a class="skip-link" href="#app">Pular para o conteúdo principal</a>

    <header class="cabecalho">
        <div class="container">
            <h1 class="logo">ONG Social</h1>

            <nav aria-label="Navegação principal">
                <a href="#inicio">Início</a>
                <a href="#projetos">Projetos</a>
                <a href="#cadastro">Cadastro</a>
            </nav>
        </div>
    </header>

    <main
        id="app"
        class="container"
        tabindex="-1"
        aria-live="polite">
        <!-- O conteúdo da SPA será inserido aqui pelo JavaScript -->
    </main>

    <footer class="rodape">
        <div class="container">
            <p>ONG Social — Juntos por um Futuro Melhor</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript principal da aplicação -->
    <script type="module" src="../js/app.js"></script>

</body>
</html>
